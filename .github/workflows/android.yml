name: Android CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@main
    - name: set up JDK 21
      uses: actions/setup-java@main
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Build debug
      run: ./gradlew app:assembleDebug
        
    - name: Build release
      if: ${{ ( github.event_name != 'pull_request' && github.ref == 'refs/heads/master' ) || github.ref_type == 'tag' }}
      run: ./gradlew app:assembleRelease

    - name: Rename debug build
      run: mv app/build/outputs/apk/debug/app-debug.apk app/build/ChromeXt_debug.apk

    - name: Rename signed apk
      if: ${{ ( github.event_name != 'pull_request' && github.ref == 'refs/heads/master' ) || github.ref_type == 'tag' }}
      run: mv app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/ChromeXt.apk

    - name: Validate signing key
      if: ${{ ( github.event_name != 'pull_request' && github.ref == 'refs/heads/master' ) || github.ref_type == 'tag' }}
      id: signing_key
      shell: bash
      env:
        SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.ALIAS }}
      run: |
        if [[ -z "$SIGNING_KEY" || -z "$KEY_STORE_PASSWORD" || -z "$KEY_ALIAS" ]]; then
          echo "::error::SIGNING_KEY, KEY_STORE_PASSWORD and ALIAS secrets must be configured."
          exit 1
        fi

        if [[ "$SIGNING_KEY" == *"PRIVATE KEY"* ]]; then
          echo "::error::SIGNING_KEY must contain a Base64-encoded JKS or PKCS12 keystore, not a PEM private key."
          exit 1
        fi

        # Accept raw Base64 as well as the BEGIN/END wrapper emitted by certutil.
        normalized_key="$({
          printf '%s\n' "$SIGNING_KEY" \
            | tr -d '\r' \
            | sed '/^-----BEGIN .*-----$/d; /^-----END .*-----$/d' \
            | tr -d '[:space:]'
        })"
        keystore="$RUNNER_TEMP/release.keystore"

        if ! printf '%s' "$normalized_key" | base64 --decode > "$keystore"; then
          echo "::error::SIGNING_KEY is not valid Base64. Encode the complete keystore file, not its path."
          exit 1
        fi

        if [[ ! -s "$keystore" ]]; then
          echo "::error::SIGNING_KEY decoded to an empty file."
          exit 1
        fi

        if ! keytool -list -keystore "$keystore" -storepass "$KEY_STORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null; then
          echo "::error::SIGNING_KEY is not a valid JKS/PKCS12 keystore, or KEY_STORE_PASSWORD/ALIAS is incorrect."
          exit 1
        fi

        echo "::add-mask::$normalized_key"
        echo "base64=$normalized_key" >> "$GITHUB_OUTPUT"

    - uses: noriban/sign-android-release@v5.1
      if: ${{ ( github.event_name != 'pull_request' && github.ref == 'refs/heads/master' ) || github.ref_type == 'tag' }}
      name: Sign app APK
      id: sign_app
      with:
        releaseDirectory: app/build/outputs/apk/release
        signingKeyBase64: ${{ steps.signing_key.outputs.base64 }}
        alias: ${{ secrets.ALIAS }}
        keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
        keyPassword: ${{ secrets.KEY_PASSWORD }}

    - name: Upload debug build
      uses: actions/upload-artifact@main
      with:
        name: ChromeXt_debug.apk
        path: app/build/ChromeXt_debug.apk

    - name: Upload signed APK
      if: ${{ ( github.event_name != 'pull_request' && github.ref == 'refs/heads/master' ) || github.ref_type == 'tag' }}
      uses: actions/upload-artifact@main
      with:
        name: ChromeXt_signed.apk
        path: ${{steps.sign_app.outputs.signedReleaseFile}}

    - name: Collect debug build
      uses: actions/download-artifact@main
      with:
        name: ChromeXt_debug.apk

    - name: Collect signed APK
      if: ${{ ( github.event_name != 'pull_request' && github.ref == 'refs/heads/master' ) || github.ref_type == 'tag' }}
      uses: actions/download-artifact@main
      with:
        name: ChromeXt_signed.apk
